name: CloudGuard Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checkov:
    name: Kubernetes IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: gitops/
          output_format: cli
          output_file_path: reports/checkov-report.json
          soft_fail: true
          #skip_path: gitops/runtime-security/kube-bench-job.yaml
  gitleaks-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  trivy-kubernetes:
    name: Kubernetes Misconfiguration Scan
    runs-on: ubuntu-latest
    needs:
      - gitleaks-scan
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Run Trivy Kubernetes Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: gitops/
          severity: HIGH,CRITICAL
          format: table
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs:
      - trivy-kubernetes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Run Trivy Filesystem Scan (via Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/apps \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:0.50.0 fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output /apps/reports/trivy-fs.json \
            /apps

  trivy-image:
    name: Container Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs:
      - trivy-filesystem

    steps:
      - name: Create reports directory
        run: mkdir -p reports

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Run Trivy Image Scan (via Docker)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/reports:/reports \
            -v ~/.cache/trivy:/root/.cache/trivy \
            aquasec/trivy:0.50.0 image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format json \
            --output /reports/trivy-image.json \
            nginx:latest

  upload-reports:
    name: Upload Security Reports
    runs-on: ubuntu-latest
    needs:
      - checkov
      - gitleaks-scan
      - trivy-kubernetes
      - trivy-filesystem
      - trivy-image
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
  ai-security:
    name: AI Security Scan
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes cluster
        run: |
          echo "Checking Kubernetes cluster..."
          kubectl get nodes

      - name: Verify AI service
        run: |
          echo "Checking AI service..."
          kubectl get pods -n ai-security
          kubectl get svc -n ai-security

      - name: Run AI security scan
        run: |
          echo "Starting CloudGuard AI security scan..."

          kubectl delete job cloudguard-ai-ci-scan \
            -n ai-security \
            --ignore-not-found

          kubectl create job \
            --from=cronjob/cloudguard-ai-nightly \
            cloudguard-ai-ci-scan \
            -n ai-security

      - name: Wait for AI security scan
        run: |
          echo "Waiting for AI security scan..."

          for i in {1..60}; do

            SUCCEEDED=$(kubectl get job cloudguard-ai-ci-scan \
              -n ai-security \
              -o jsonpath='{.status.succeeded}')

            FAILED=$(kubectl get job cloudguard-ai-ci-scan \
              -n ai-security \
              -o jsonpath='{.status.failed}')

            if [ "$SUCCEEDED" = "1" ]; then
              echo "AI security scan completed successfully."
              exit 0
            fi

            if [ "$FAILED" = "1" ]; then
              echo "AI security scan FAILED."
              kubectl logs job/cloudguard-ai-ci-scan -n ai-security
              exit 1
            fi

            sleep 2
          done

          echo "AI security scan timed out."
          kubectl logs job/cloudguard-ai-ci-scan -n ai-security || true
          exit 1

      - name: Display AI security report
        if: always()
        run: |
          echo "========== AI SECURITY REPORT =========="
          kubectl logs job/cloudguard-ai-ci-scan \
            -n ai-security || true
