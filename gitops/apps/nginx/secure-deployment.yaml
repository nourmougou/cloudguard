apiVersion: apps/v1
kind: Deployment

metadata:
  name: secure-nginx
  namespace: demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: secure-nginx

  template:
    metadata:
      labels:
        app: secure-nginx

    spec:
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx

          # Replace with your full digest or use nginx:latest
          image: nginx:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          envFrom:
            - configMapRef:
                name: app-config

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-run
              mountPath: /var/run

            - name: nginx-tmp
              mountPath: /tmp

            - name: db-secret-volume
              mountPath: /etc/secrets
              readOnly: true

      volumes:
        - name: nginx-cache
          emptyDir: {}

        - name: nginx-run
          emptyDir: {}

        - name: nginx-tmp
          emptyDir: {}

        - name: db-secret-volume
          secret:
            secretName: db-secret
